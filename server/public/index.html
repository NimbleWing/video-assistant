<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地媒体库</title>
<style>
  :root {
    --bg: #101418; --panel: #1a2027; --panel2: #212933; --line: #2d3846;
    --fg: #dde5ee; --dim: #8b98a8; --accent: #4da3ff; --ok: #5fbf7a; --warn: #e0a84e; --err: #e06c5f;
    font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-size: 14px; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px 10px; }
  header h1 { font-size: 18px; margin: 0; }
  header .stat { color: var(--dim); font-size: 13px; }
  nav { padding: 0 20px; border-bottom: 1px solid var(--line); display: flex; gap: 4px; }
  nav button { background: none; border: none; color: var(--dim); font-size: 14px; padding: 8px 14px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  main { padding: 16px 20px 40px; max-width: 1200px; }
  section[hidden] { display: none; }
  search.bar, .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  input[type="search"], select, textarea {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  input[type="search"] { width: 260px; }
  button.act { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button.act:hover { border-color: var(--accent); }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; white-space: nowrap; }
  td.name { max-width: 460px; overflow-wrap: anywhere; }
  td .path { color: var(--dim); font-size: 12px; }
  .badge { display: inline-block; border-radius: 10px; padding: 1px 9px; font-size: 12px; }
  .badge.video { background: #16324a; color: var(--accent); }
  .badge.cover { background: #3a3320; color: var(--warn); }
  .badge.complete { background: #1c3a27; color: var(--ok); }
  .badge.failed { background: #43221e; color: var(--err); }
  .badge.downloading { background: #16324a; color: var(--accent); }
  .badge.canceled, .badge.skipped { background: #333a44; color: var(--dim); }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 12px; color: var(--dim); }
  .empty { color: var(--dim); padding: 30px 0; text-align: center; }
  .hint { color: var(--dim); font-size: 12px; margin: 8px 0; }
  .warn-list { color: var(--warn); font-size: 12px; margin: 6px 0; white-space: pre-line; }
  textarea { width: 100%; min-height: 120px; font-family: Consolas, monospace; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; }
  legend { color: var(--dim); font-size: 12px; padding: 0 6px; }
  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; max-width: 92vw; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.65); }
  dialog video { max-width: 86vw; max-height: 78vh; display: block; background: #000; }
  dialog .vtitle { font-size: 13px; color: var(--dim); margin-bottom: 8px; max-width: 86vw; overflow-wrap: anywhere; }
  .scan-result { margin-top: 10px; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { background: var(--panel); border: 1px solid var(--line); color: var(--dim); border-radius: 14px; padding: 3px 12px; cursor: pointer; font-size: 12px; }
  .chips button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
  .chips .n { color: var(--accent); margin-left: 4px; }
</style>
</head>
<body>
<header>
  <h1>本地媒体库</h1>
  <span class="stat" id="stat">加载中…</span>
</header>
<nav>
  <button type="button" id="tab-videos" aria-selected="true">视频库</button>
  <button type="button" id="tab-ledger" aria-selected="false">下载账本</button>
  <button type="button" id="tab-settings" aria-selected="false">设置</button>
</nav>
<main>
  <section id="sec-videos">
    <search class="bar">
      <input type="search" id="v-q" placeholder="搜索文件名 / 路径" aria-label="搜索">
      <select id="v-volume" aria-label="盘符"><option value="">全部盘符</option></select>
      <select id="v-type" aria-label="类型">
        <option value="video">视频</option>
        <option value="cover">封面</option>
      </select>
    </search>
    <div id="v-table"></div>
    <div class="pager">
      <button type="button" class="act" id="v-prev">上一页</button>
      <span id="v-page"></span>
      <button type="button" class="act" id="v-next">下一页</button>
    </div>
  </section>

  <section id="sec-ledger" hidden>
    <div class="bar">
      <div class="chips" id="l-chips"></div>
    </div>
    <p class="hint">失败项重试由扩展侧面板发起（「重试历史失败」），本页仅展示。</p>
    <div id="l-table"></div>
    <div class="pager">
      <button type="button" class="act" id="l-prev">上一页</button>
      <span id="l-page"></span>
      <button type="button" class="act" id="l-next">下一页</button>
    </div>
  </section>

  <section id="sec-settings" hidden>
    <fieldset>
      <legend>扫描目录（每行一个绝对路径）</legend>
      <textarea id="s-dirs" spellcheck="false" placeholder="D:\Videos&#10;E:\收藏"></textarea>
      <div class="bar" style="margin-top:10px">
        <button type="button" class="act primary" id="s-save">保存目录</button>
        <button type="button" class="act" id="s-scan">立即扫描</button>
        <span class="hint" id="s-warn"></span>
      </div>
      <div class="scan-result" id="s-result"></div>
    </fieldset>
    <p class="hint">服务运行于 127.0.0.1:17321，仅供本机使用；扩展会自动调用判定接口，服务未启动时扩展自动回退浏览器下载历史判定。</p>
  </section>
</main>

<dialog id="player">
  <div class="vtitle" id="p-title"></div>
  <video controls preload="metadata" width="960" height="540" id="p-video"></video>
  <div class="bar" style="margin-top:10px;justify-content:flex-end">
    <button type="button" class="act" id="p-copy">复制路径</button>
    <button type="button" class="act primary" id="p-close">关闭</button>
  </div>
</dialog>

<script type="module">
const $ = (id) => document.getElementById(id);
const fmtSize = (n) => {
  if (!n) return '-';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i += 1; }
  return `${n.toFixed(n >= 100 || i === 0 ? 0 : 1)} ${u[i]}`;
};
const fmtDur = (s) => {
  if (!s || s <= 0) return '';
  const m = Math.floor(s / 60), ss = Math.round(s % 60);
  return `${m}:${String(ss).padStart(2, '0')}`;
};
const fmtTime = (ms) => (ms ? new Date(ms).toLocaleString('zh-CN', { hour12: false }) : '-');

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ ok: false, error: r.statusText }));
  if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText);
  return j;
}

// ---------------------------------------------------------------- tabs
const tabs = { videos: $('tab-videos'), ledger: $('tab-ledger'), settings: $('tab-settings') };
for (const [name, btn] of Object.entries(tabs)) {
  btn.addEventListener('click', () => {
    for (const b of Object.values(tabs)) b.setAttribute('aria-selected', String(b === btn));
    for (const s of document.querySelectorAll('main section')) s.hidden = s.id !== `sec-${name}`;
    if (name === 'settings') loadSettings();
    if (name === 'ledger') loadLedger();
  });
}

// ---------------------------------------------------------------- 视频库
const vState = { page: 1, total: 0 };
async function loadVideos() {
  const q = $('v-q').value.trim();
  const url = `/api/videos?page=${vState.page}&size=50&type=${$('v-type').value}`
    + ($('v-volume').value ? `&volume=${encodeURIComponent($('v-volume').value)}` : '')
    + (q ? `&q=${encodeURIComponent(q)}` : '');
  const j = await api(url);
  vState.total = j.total;
  renderVolumes(j.volumes || []);
  const rows = j.items.map((it) => `
    <tr>
      <td class="name">${it.type === 'video'
        ? `<button type="button" class="act" data-play="${it.id}" style="margin-right:6px">播放</button>`
        : ''}<span class="badge ${it.type}">${it.type === 'video' ? it.ext.toUpperCase() : '封面'}</span> ${it.stem}
        <div class="path">${it.path}</div></td>
      <td>${it.volume}</td>
      <td>${fmtSize(it.size)}</td>
      <td>${fmtDur(it.duration)}</td>
      <td>${fmtTime(it.mtime)}</td>
    </tr>`).join('');
  $('v-table').innerHTML = rows
    ? `<table><thead><tr><th>名称</th><th>盘</th><th>大小</th><th>时长</th><th>修改时间</th></tr></thead><tbody>${rows}</tbody></table>`
    : '<div class="empty">没有匹配的条目（先在设置页配置目录并扫描）</div>';
  const pages = Math.max(1, Math.ceil(j.total / 50));
  $('v-page').textContent = `${vState.page} / ${pages}（共 ${j.total}）`;
  $('v-prev').disabled = vState.page <= 1;
  $('v-next').disabled = vState.page >= pages;
  $('stat').textContent = `视频 ${j.volumes?.reduce((a, v) => a + v.videos, 0) ?? j.total} · 命中 ${j.total}`;
}
function renderVolumes(vols) {
  const cur = $('v-volume').value;
  $('v-volume').innerHTML = '<option value="">全部盘符</option>'
    + vols.map((v) => `<option value="${v.volume}">${v.volume}（${v.videos}）</option>`).join('');
  if (vols.some((v) => v.volume === cur)) $('v-volume').value = cur;
}
$('v-prev').addEventListener('click', () => { vState.page -= 1; loadVideos(); });
$('v-next').addEventListener('click', () => { vState.page += 1; loadVideos(); });
$('v-volume').addEventListener('change', () => { vState.page = 1; loadVideos(); });
$('v-type').addEventListener('change', () => { vState.page = 1; loadVideos(); });
let vqTimer = 0;
$('v-q').addEventListener('input', () => {
  clearTimeout(vqTimer);
  vqTimer = setTimeout(() => { vState.page = 1; loadVideos(); }, 300);
});

// 播放（事件委托）
let playPath = '';
document.addEventListener('click', (e) => {
  const btn = /** @type {HTMLElement} */ (e.target)?.closest?.('[data-play]');
  if (!btn) return;
  const id = btn.getAttribute('data-play');
  const path = btn.closest('td')?.querySelector('.path')?.textContent || '';
  playPath = path;
  $('p-title').textContent = path;
  const v = $('p-video');
  v.src = `/stream/${id}`;
  $('player').showModal();
  v.play().catch(() => {});
});
$('p-close').addEventListener('click', () => closePlayer());
$('player').addEventListener('close', closePlayer);
function closePlayer() {
  const v = $('p-video');
  v.pause();
  v.removeAttribute('src');
  v.load();
}
$('p-copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(playPath); $('p-copy').textContent = '已复制'; setTimeout(() => { $('p-copy').textContent = '复制路径'; }, 1200); } catch {}
});

// ---------------------------------------------------------------- 账本
const L_STATUSES = ['failed', 'complete', 'downloading', 'canceled', 'skipped'];
const lState = { status: 'failed', page: 1 };
async function loadLedger() {
  const j = await api(`/api/downloads?status=${lState.status}&page=${lState.page}&size=50`);
  const counts = j.counts || {};
  $('l-chips').innerHTML = [''].concat(L_STATUSES).map((s) => {
    const on = lState.status === s;
    const label = s === '' ? '全部' : s;
    const n = s === '' ? Object.values(counts).reduce((a, b) => a + b, 0) : (counts[s] || 0);
    return `<button type="button" data-st="${s}" aria-pressed="${on}">${label}<span class="n">${n}</span></button>`;
  }).join('');
  const rows = j.items.map((it) => `
    <tr>
      <td class="name">${it.series_name ? `<b>${it.series_name}</b> / ` : ''}${it.name}
        <div class="path">${it.site} ${it.page_path}${it.filename ? ' → ' + it.filename : ''}</div></td>
      <td><span class="badge ${it.status}">${it.status}</span></td>
      <td>${it.quality || '-'}</td>
      <td>${it.attempts}</td>
      <td>${it.error ? `<span style="color:var(--err)">${it.error}</span>` : fmtSize(it.size)}</td>
      <td>${fmtTime(it.updated_at)}</td>
    </tr>`).join('');
  $('l-table').innerHTML = rows
    ? `<table><thead><tr><th>视频</th><th>状态</th><th>清晰度</th><th>尝试</th><th>大小 / 错误</th><th>更新</th></tr></thead><tbody>${rows}</tbody></table>`
    : '<div class="empty">没有记录</div>';
  const pages = Math.max(1, Math.ceil(j.total / 50));
  $('l-page').textContent = `${lState.page} / ${pages}（共 ${j.total}）`;
  $('l-prev').disabled = lState.page <= 1;
  $('l-next').disabled = lState.page >= pages;
}
$('l-prev').addEventListener('click', () => { lState.page -= 1; loadLedger(); });
$('l-next').addEventListener('click', () => { lState.page += 1; loadLedger(); });
$('l-chips').addEventListener('click', (e) => {
  const btn = /** @type {HTMLElement} */ (e.target)?.closest?.('[data-st]');
  if (!btn) return;
  lState.status = btn.getAttribute('data-st') || '';
  lState.page = 1;
  loadLedger();
});

// ---------------------------------------------------------------- 设置
async function loadSettings() {
  const j = await api('/api/config');
  $('s-dirs').value = (j.scanDirs || []).join('\n');
}
$('s-save').addEventListener('click', async () => {
  const dirs = $('s-dirs').value.split('\n').map((s) => s.trim()).filter(Boolean);
  try {
    const j = await api('/api/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scanDirs: dirs }),
    });
    $('s-warn').textContent = j.warnings?.length ? j.warnings.join('；') : '已保存';
  } catch (e) { $('s-warn').textContent = String(/** @type {Error} */ (e).message); }
});
$('s-scan').addEventListener('click', async () => {
  $('s-result').textContent = '扫描中…（大目录可能需要较长时间）';
  try {
    const j = await api('/api/scan', { method: 'POST' });
    const r = j.result;
    $('s-result').innerHTML = `完成：视频 ${r.videos} · 封面 ${r.covers} · 清理失效 ${r.removed} · 耗时 ${(r.ms / 1000).toFixed(1)}s`
      + (r.warnings?.length ? `<div class="warn-list">${r.warnings.join('\n')}</div>` : '');
    loadVideos();
  } catch (e) { $('s-result').textContent = `扫描失败：${String(/** @type {Error} */ (e).message)}`; }
});

loadVideos().catch((e) => { $('stat').textContent = `加载失败：${String(/** @type {Error} */ (e).message)}`; });
</script>
</body>
</html>
